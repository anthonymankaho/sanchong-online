name = "sanchong-online"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# QwenCloud (Singapore) Token Plan endpoint — Anthony's account/key type.
# Not a secret; the API key itself stays in a Worker secret.
[vars]
QWEN_BASE_URL = "https://token-plan.maas.qwencloudapi.com/compatible-mode/v1"
QWEN_MODEL = "qwen3.7-plus"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sanchong-db"
database_id = "1fb70392-29ba-4956-8c16-b2274eb805cb"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "sanchong-photos"
