<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="中山三鄉睇樓評分表（線上版）— 實地檢查評分＋多盤比較">
<title>中山三鄉睇樓評分表 · 線上版</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏠</text></svg>">
<style>
  :root{
    --primary:#1976d2; --success:#2e7d32; --danger:#c62828; --warning:#ff9800;
    --bg:#f5f7fa; --card:#fff; --text:#333; --border:#e0e0e0; --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:70px}
  .wrap{max-width:760px;margin:0 auto;padding:12px}
  header{text-align:center;padding:14px 0 10px;border-bottom:2px solid var(--primary);margin-bottom:12px}
  header h1{font-size:21px;color:var(--primary)}
  header p{font-size:12px;color:#777;margin-top:2px}

  /* bottom tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
          display:flex;z-index:50;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
  .tabbar button{flex:1;min-height:56px;border:none;background:none;font-size:13px;color:#888;cursor:pointer;
                 display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
  .tabbar button .ico{font-size:20px}
  .tabbar button.active{color:var(--primary);font-weight:600}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;
       border:none;border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;width:100%;gap:4px}
  .btn:active{opacity:.75}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:#555}
  .btn-sm{min-height:38px;padding:7px 12px;font-size:14px;width:auto}

  .card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
        border:1px solid #eee;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card-title{font-size:17px;font-weight:700;overflow-wrap:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
  .tag-blue{background:#e3f2fd;color:#1565c0}.tag-green{background:#e8f5e9;color:#2e7d32}
  .tag-gray{background:#f5f5f5;color:#666;border:1px solid #ddd}.tag-orange{background:#fff3e0;color:#e65100}
  .badge{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         font-weight:700;font-size:17px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .b-high{background:var(--success)}.b-mid{background:var(--warning)}.b-low{background:var(--danger)}
  .price-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:8px 0}
  .price-main{font-size:17px;font-weight:700;color:var(--danger)}
  .price-unit{font-size:12px;color:#888}
  .avg-row{font-size:13px;color:#555;background:#f0f7ff;border:1px solid #d6e9ff;border-radius:6px;padding:5px 9px;margin:6px 0}
  .avg-row b{color:var(--primary)}
  .photo-strip{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .photo-strip img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid #eee;cursor:pointer}
  .photo-more{width:62px;height:62px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;
              border-radius:8px;font-size:12px;color:#999;border:1px dashed #ccc;cursor:pointer}
  .card-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0}
  .card-actions .btn{flex:1;width:auto}
  .card-time{text-align:right;font-size:11px;color:#bbb;margin-top:6px}
  .empty{text-align:center;padding:50px 20px;color:#bbb;font-size:15px;line-height:1.9}

  .sec{font-size:14px;font-weight:600;color:var(--primary);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid #e8e8e8}
  .lbl{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
  .inp,.sel,.ta{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
                font-size:16px;background:#fff}
  .inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(25,118,210,.1)}
  .ta{height:80px;resize:vertical}
  .row{display:flex;gap:10px}.col{flex:1;min-width:0}
  .req{color:var(--danger)}
  .mb{margin-bottom:12px}

  .star-group{display:flex;gap:6px;flex-wrap:wrap}
  .star-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);background:#fff;
            display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;color:#888}
  .star-btn.active{background:#e3f2fd;border-color:var(--primary);color:var(--primary);transform:scale(1.08)}

  .score5{display:flex;gap:5px;flex-wrap:wrap}
  .s5{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border);background:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;cursor:pointer;color:#888}
  .s5.active{background:#e8f5e9;border-color:var(--success);color:var(--success)}
  .s5.na.active{background:#f5f5f5;border-color:#999;color:#666}

  .chk-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #eee}
  .chk-item:last-child{border-bottom:none}
  .chk-name{font-size:14px;flex:1;min-width:0}

  table.cmp{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  table.cmp th,table.cmp td{border:1px solid #e5e5e5;padding:7px 8px;text-align:center}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;font-weight:500;color:#555;white-space:nowrap}
  table.cmp thead th{background:#f0f7ff;color:var(--primary);position:sticky;top:0}
  table.cmp td.best{background:#e8f5e9;font-weight:700;color:var(--success)}
  .tbl-scroll{overflow-x:auto;border-radius:8px;border:1px solid #e5e5e5}

  .photo-add{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px;
             border:2px dashed var(--border);border-radius:8px;background:#fafbfc;font-size:14px;color:#888;cursor:pointer}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-item{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid #eee}
  .photo-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .photo-del{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);
             color:#fff;border:none;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}

  /* ---- photo preview lightbox ---- */
  .pv-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;flex-direction:column;
            align-items:center;justify-content:center;touch-action:none}
  .pv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
          padding:10px 12px;color:#fff;z-index:2;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .pv-count{font-size:14px;font-weight:600;letter-spacing:.02em}
  .pv-close{width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;
            font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pv-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .pv-img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;
          background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;
          justify-content:center;z-index:2}
  .pv-nav:disabled{opacity:.25;cursor:default}
  .pv-prev{left:8px}.pv-next{right:8px}
  .pv-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;
           pointer-events:none}
  /* ---- AI assistant ---- */
  .ai-fab{position:fixed;right:14px;bottom:70px;width:56px;height:56px;border-radius:50%;border:none;
          background:linear-gradient(135deg,#1976d2,#7b1fa2);color:#fff;font-size:26px;cursor:pointer;
          box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;display:flex;align-items:center;justify-content:center}
  .ai-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
  .ai-panel{background:#fff;width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;
            border-radius:16px 16px 0 0;overflow:hidden}
  .ai-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ai-head h3{font-size:16px;margin:0}
  .ai-quota{font-size:11px;color:#888;margin-top:2px}
  .ai-disclose{font-size:11px;color:#999;padding:6px 16px;background:#fafbfc;border-bottom:1px solid #eee}
  .ai-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .ai-msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:break-word}
  .ai-msg.user{align-self:flex-end;background:#e3f2fd;color:#0d47a1}
  .ai-msg.bot{align-self:flex-start;background:#f5f5f5;color:#333}
  .ai-msg.err{align-self:flex-start;background:#ffebee;color:#b71c1c}
  .ai-ops{border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin:4px 0;background:#fcfcfd}
  .ai-ops-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
  .ai-ops-head input{width:20px;height:20px}
  .ai-diff{font-size:12px;color:#555;margin:2px 0 2px 28px}
  .ai-diff .old{color:#b71c1c;text-decoration:line-through}
  .ai-diff .new{color:#2e7d32;font-weight:600}
  .ai-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .ai-inputrow{display:flex;gap:8px}
  .ai-inputrow textarea{flex:1;min-height:44px;max-height:110px;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;resize:none}
  .ai-btnrow{display:flex;gap:8px}
  .ai-btnrow .btn{flex:1}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:rgba(0,0,0,.8);color:#fff;
         padding:9px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .unit-picker{margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>🏠 中山三鄉睇樓評分表</h1>
  <p>線上版 · 實地檢查 67 項 · 多盤比較</p>
</header>

<div class="wrap">
  <!-- ============ LIST ============ -->
  <section id="view-list">
    <div class="mb"><button class="btn btn-success" data-act="new">＋ 新增單位</button></div>
    <div id="unitList"></div>
  </section>

  <!-- ============ FORM ============ -->
  <section id="view-form" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 id="formTitle" style="font-size:18px">新增單位</h2>
        <button class="btn btn-sm btn-outline" data-act="cancel">✕ 關閉</button>
      </div>

      <div class="sec">基本資料</div>
      <div class="mb">
        <label class="lbl">樓盤名稱 <span class="req">*</span></label>
        <select class="sel" id="f_estate_pick" style="margin-bottom:8px"></select>
        <input class="inp" id="f_estate" placeholder="或輸入其他樓盤名稱">
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">座數／單位</label><input class="inp" id="f_unit" placeholder="3座 1205室"></div>
        <div class="col"><label class="lbl">類型</label><select class="sel" id="f_type"><option>二手</option><option>一手</option></select></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">實用面積 ㎡</label><input class="inp" id="f_area_use" type="number" step="0.01" inputmode="decimal"></div>
        <div class="col"><label class="lbl">建築面積 ㎡</label><input class="inp" id="f_area_build" type="number" step="0.01" inputmode="decimal"></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">房間</label><input class="inp" id="f_rooms" placeholder="2房2衛"></div>
        <div class="col"><label class="lbl">浴室／廁所</label><input class="inp" id="f_baths" placeholder="2"></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">車位</label><input class="inp" id="f_parking" placeholder="1"></div>
        <div class="col"><label class="lbl">樓層／總樓層</label><input class="inp" id="f_floor" placeholder="12/26"></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">裝修</label><select class="sel" id="f_decor"><option>毛坯</option><option>簡裝</option><option>精裝</option><option>豪華裝修</option></select></div>
        <div class="col"><label class="lbl">朝向</label><input class="inp" id="f_facing" placeholder="南"></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">建築年份</label><input class="inp" id="f_year_built" type="number" inputmode="numeric"></div>
        <div class="col"><label class="lbl">樓齡（年）</label><input class="inp" id="f_age_years" type="number" inputmode="numeric"></div>
      </div>
      <div class="mb"><label class="lbl">現業主持有／居住年期</label><input class="inp" id="f_hold_years" placeholder="例如：5 年"></div>

      <div class="sec">價格</div>
      <div class="row mb">
        <div class="col"><label class="lbl">叫價（人民幣）</label><input class="inp" id="f_price" type="number" step="10000" inputmode="numeric"></div>
        <div class="col"><label class="lbl">議價後價格</label><input class="inp" id="f_price_negotiated" type="number" step="10000" inputmode="numeric"></div>
      </div>
      <div class="row mb">
        <div class="col"><label class="lbl">當年一手售價</label><input class="inp" id="f_price_original" type="number" step="10000" inputmode="numeric"></div>
        <div class="col"><label class="lbl">每月管理費</label><input class="inp" id="f_mgmt_fee" type="number" inputmode="numeric"></div>
      </div>
      <div class="mb"><label class="lbl">預計裝修維修費</label><input class="inp" id="f_reno_cost" type="number" step="1000" inputmode="numeric"></div>

      <div class="sec">總體評分（1–10）</div>
      <div class="star-group mb" id="scoreGroup"></div>

      <div class="sec">六項細分（1–10）</div>
      <div class="row mb" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="lbl">位置交通</label><select class="sel sc" id="sc_loc"></select></div>
        <div><label class="lbl">戶型格局</label><select class="sel sc" id="sc_layout"></select></div>
        <div><label class="lbl">裝修狀況</label><select class="sel sc" id="sc_decor"></select></div>
        <div><label class="lbl">小區環境</label><select class="sel sc" id="sc_env"></select></div>
        <div><label class="lbl">性價比</label><select class="sel sc" id="sc_value"></select></div>
        <div><label class="lbl">代理可信度</label><select class="sel sc" id="sc_agent"></select></div>
      </div>

      <div class="sec">交易風險與決定</div>
      <div class="mb"><label class="lbl">主要優點</label><textarea class="ta" id="f_pros"></textarea></div>
      <div class="mb"><label class="lbl">主要缺點</label><textarea class="ta" id="f_cons"></textarea></div>
      <div class="mb"><label class="lbl">最終意向</label><input class="inp" id="f_intent" placeholder="例如：列入短名單 / 放棄"></div>
      <div class="mb"><label class="lbl">備註</label><textarea class="ta" id="f_note" placeholder="滲水、潮濕、噪音、採光、議價空間、代理說法…"></textarea></div>

      <div class="sec">現場照片</div>
      <label class="photo-add" for="f_photos">📷 選擇照片／即場影相（自動壓縮）</label>
      <input type="file" id="f_photos" accept="image/*" multiple capture="environment" style="display:none">
      <div class="photo-grid" id="photoGrid"></div>

      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-primary" style="flex:1" data-act="save">💾 儲存</button>
        <button class="btn btn-outline" style="flex:1" data-act="cancel">取消</button>
      </div>
    </div>
  </section>

  <!-- ============ CHECKLIST ============ -->
  <section id="view-check" class="hidden">
    <div class="card unit-picker">
      <label class="lbl">選擇樓盤</label>
      <select class="sel" id="chkUnit"></select>
      <div class="avg-row" id="chkProgress" style="margin-top:10px"></div>
    </div>
    <div id="chkBody"></div>
    <div class="mb"><button class="btn btn-primary" data-act="saveCheck">💾 儲存檢查表</button></div>
  </section>

  <!-- ============ COMPARE ============ -->
  <section id="view-compare" class="hidden">
    <div class="card">
      <div class="sec">多盤比較</div>
      <div class="tbl-scroll" id="cmpWrap"></div>
      <p style="font-size:12px;color:#888;margin-top:10px">
        評分規則：1=很差、2=較差、3=一般、4=良好、5=優秀；不適用或未評分不計入平均。<br>
        綠色＝該列最佳值。估計總成本＝叫價＋預計裝修維修費。
      </p>
    </div>
  </section>
</div>

<button class="ai-fab" id="aiFab" aria-label="開啟 AI 助手" title="AI 助手">🤖</button>

<div class="ai-modal hidden" id="aiModal" role="dialog" aria-modal="true" aria-label="AI 睇樓助手">
  <div class="ai-panel">
    <div class="ai-head">
      <div>
        <h3>🤖 AI 睇樓助手</h3>
        <div class="ai-quota" id="aiQuota"></div>
      </div>
      <button class="btn btn-sm btn-outline" id="aiClose" aria-label="關閉">✕</button>
    </div>
    <div class="ai-disclose">會傳送俾 AI：你嘅訊息＋單位摘要（名稱／價格／面積／評分／備註／優缺點）。唔會傳送相片。</div>
    <div class="ai-msgs" id="aiMsgs"></div>
    <div class="ai-foot">
      <div id="aiOpsWrap"></div>
      <div class="ai-btnrow hidden" id="aiApplyRow">
        <button class="btn btn-sm btn-primary" id="aiApply">✔ 套用已選</button>
        <button class="btn btn-sm btn-outline" id="aiDiscard">🗑 棄置</button>
        <button class="btn btn-sm btn-outline hidden" id="aiUndo">↩ 還原</button>
      </div>
      <div class="ai-inputrow">
        <textarea id="aiInput" placeholder="例如：比較呢幾盤邊個最抵？／幫我将備註整理成優缺點" rows="1"></textarea>
        <button class="btn btn-primary" style="width:auto;padding:0 18px" id="aiSend">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="tabbar">
  <button data-tab="list" class="active"><span class="ico">📋</span>列表</button>
  <button data-tab="form"><span class="ico">➕</span>新增</button>
  <button data-tab="check"><span class="ico">✅</span>檢查表</button>
  <button data-tab="compare"><span class="ico">⚖️</span>比較</button>
</div>
<div class="toast" id="toast"></div>

<div class="pv-modal hidden" id="photoPreview" role="dialog" aria-modal="true" aria-label="相片預覽">
  <div class="pv-top">
    <span class="pv-count" id="pvCount">1 / 1</span>
    <button class="pv-close" id="pvClose" type="button" aria-label="關閉預覽">✕</button>
  </div>
  <div class="pv-stage" id="pvStage">
    <button class="pv-nav pv-prev" id="pvPrev" type="button" aria-label="上一張">‹</button>
